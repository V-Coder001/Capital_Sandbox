<title>Geschichten</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="stil.css">
<div class="huelle" id="huelle"><p class="hinweis">Einen Moment …</p></div>
<script type="module">
import { hole, dauer, datum } from './gemeinsam.js';

const huelle = document.getElementById('huelle');

const GEHOERT = 'geschichten-gehoert';
function gehoert() {
  try { return new Set(JSON.parse(localStorage.getItem(GEHOERT) || '[]')); } catch { return new Set(); }
}
function merken(id) {
  const menge = gehoert();
  menge.add(id);
  try { localStorage.setItem(GEHOERT, JSON.stringify([...menge])); } catch { /* egal */ }
}

function zeichnen(liste) {
  const schon = gehoert();
  huelle.innerHTML = `
    <div class="kopf"><h1>Geschichten</h1><a href="/aufnehmen">Neue aufnehmen →</a></div>
    <p class="unterzeile">${liste.length === 0 ? 'Noch nichts da.'
      : `${liste.length} ${liste.length === 1 ? 'Geschichte' : 'Geschichten'} für dich.`}</p>
    <div id="liste"></div>`;

  const ziel = huelle.querySelector('#liste');
  for (const g of liste) {
    const karte = document.createElement('article');
    karte.className = 'karte';
    karte.innerHTML = `
      <h2></h2>
      <p class="meta"></p>
      <p class="notiz"></p>
      <audio controls preload="none" src="/audio/${encodeURIComponent(g.id)}"></audio>`;

    const h2 = karte.querySelector('h2');
    h2.textContent = g.titel;
    if (!schon.has(g.id)) h2.insertAdjacentHTML('beforeend', '<span class="neu">neu</span>');
    karte.querySelector('.meta').textContent = [datum(g.datum), dauer(g.sekunden)].filter(Boolean).join(' · ');
    const notiz = karte.querySelector('.notiz');
    if (g.notiz) notiz.textContent = g.notiz; else notiz.remove();

    karte.querySelector('audio').addEventListener('play', () => {
      merken(g.id);
      karte.querySelector('.neu')?.remove();
    }, { once: true });

    ziel.append(karte);
  }
}

try { zeichnen(await hole('/api/geschichten')); }
catch (e) { huelle.innerHTML = `<p class="fehler">${e.message}</p>`; }
</script>
