<title>Geschichte aufnehmen</title>
<link rel="stylesheet" href="stil.css">
<div class="huelle" id="huelle"><p class="hinweis">Einen Moment …</p></div>
<script type="module">
import { hole, anmeldung, dauer } from './gemeinsam.js';

const huelle = document.getElementById('huelle');
await anmeldung(huelle, { brauchtAdmin: true });

huelle.innerHTML = `
  <div class="kopf"><h1>Neue Geschichte</h1><a href="/">← Alle Geschichten</a></div>
  <p class="unterzeile">Direkt hier aufnehmen oder eine fertige Datei auswählen.</p>

  <section class="karte">
    <div class="reihe">
      <button id="knopf">Aufnahme starten</button>
      <span class="zaehler" id="zaehler">0:00</span>
      <span class="punkt" id="punkt" hidden>●</span>
    </div>
    <p class="hinweis" id="aufnahmehinweis" style="margin-bottom:0">Mikrofon wird erst beim Start gefragt.</p>
    <audio id="vorhoeren" controls hidden></audio>
  </section>

  <section class="karte">
    <label for="datei">… oder Datei vom Gerät</label>
    <input type="file" id="datei" accept="audio/*">
  </section>

  <section class="karte">
    <label for="titel">Titel</label>
    <input type="text" id="titel" placeholder="Der Nachtzug nach Lissabon" maxlength="120">
    <label for="notiz">Notiz an sie (optional)</label>
    <textarea id="notiz" maxlength="500" placeholder="Die zweite Hälfte ist etwas albern geworden."></textarea>
    <p class="fehler" id="fehler"></p>
    <div class="reihe">
      <button id="senden" disabled>Hochladen</button>
      <button class="still" id="verwerfen" type="button" hidden>Aufnahme verwerfen</button>
    </div>
    <p class="hinweis" id="status"></p>
  </section>`;

const knopf = huelle.querySelector('#knopf');
const zaehler = huelle.querySelector('#zaehler');
const punkt = huelle.querySelector('#punkt');
const vorhoeren = huelle.querySelector('#vorhoeren');
const dateiFeld = huelle.querySelector('#datei');
const titelFeld = huelle.querySelector('#titel');
const notizFeld = huelle.querySelector('#notiz');
const senden = huelle.querySelector('#senden');
const verwerfen = huelle.querySelector('#verwerfen');
const fehler = huelle.querySelector('#fehler');
const status = huelle.querySelector('#status');
const aufnahmehinweis = huelle.querySelector('#aufnahmehinweis');

let aufnehmer = null;
let stuecke = [];
let spur = null;          // { blob, endung, sekunden }
let startZeit = 0;
let ticker = null;
let vorschauUrl = null;

if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) {
  knopf.disabled = true;
  aufnahmehinweis.textContent = 'Dieser Browser kann nicht direkt aufnehmen — nimm bitte eine Datei.';
}

function endungAus(typ, name) {
  const ausName = /\.([a-z0-9]+)$/i.exec(name || '')?.[1]?.toLowerCase();
  if (ausName) return ausName;
  const basis = (typ || '').split(';')[0];
  return { 'audio/webm': 'webm', 'audio/ogg': 'ogg', 'audio/mpeg': 'mp3',
           'audio/mp4': 'm4a', 'audio/wav': 'wav', 'audio/aac': 'aac' }[basis] || 'webm';
}

function spurSetzen(neu) {
  spur = neu;
  senden.disabled = !spur;
  verwerfen.hidden = !spur;
  if (vorschauUrl) URL.revokeObjectURL(vorschauUrl);
  if (spur) {
    vorschauUrl = URL.createObjectURL(spur.blob);
    vorhoeren.src = vorschauUrl;
    vorhoeren.hidden = false;
  } else {
    vorschauUrl = null;
    vorhoeren.removeAttribute('src');
    vorhoeren.hidden = true;
  }
}

knopf.addEventListener('click', async () => {
  if (aufnehmer) { aufnehmer.stop(); return; }
  fehler.textContent = '';
  let strom;
  try {
    strom = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch {
    fehler.textContent = 'Kein Zugriff aufs Mikrofon. Erlaube ihn im Browser — oder nimm eine Datei.';
    return;
  }
  stuecke = [];
  aufnehmer = new MediaRecorder(strom);
  aufnehmer.addEventListener('dataavailable', (e) => { if (e.data.size) stuecke.push(e.data); });
  aufnehmer.addEventListener('stop', () => {
    const sekunden = Math.round((Date.now() - startZeit) / 1000);
    const typ = aufnehmer.mimeType || 'audio/webm';
    strom.getTracks().forEach((t) => t.stop());
    clearInterval(ticker);
    aufnehmer = null;
    punkt.hidden = true;
    knopf.textContent = 'Aufnahme starten';
    dateiFeld.value = '';
    spurSetzen({ blob: new Blob(stuecke, { type: typ }), endung: endungAus(typ), sekunden });
    aufnahmehinweis.textContent = `Aufgenommen: ${dauer(sekunden) || 'wenige Sekunden'}. Hör kurz rein.`;
  });
  startZeit = Date.now();
  aufnehmer.start();
  punkt.hidden = false;
  knopf.textContent = 'Aufnahme beenden';
  aufnahmehinweis.textContent = 'Läuft. Erzähl.';
  ticker = setInterval(() => {
    const s = Math.floor((Date.now() - startZeit) / 1000);
    zaehler.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  }, 250);
});

dateiFeld.addEventListener('change', () => {
  const datei = dateiFeld.files?.[0];
  if (!datei) return;
  const gewaehlt = { blob: datei, endung: endungAus(datei.type, datei.name), sekunden: 0 };
  spurSetzen(gewaehlt);
  aufnahmehinweis.textContent = 'Datei gewählt.';
  if (!titelFeld.value) titelFeld.value = datei.name.replace(/\.[^.]+$/, '');
  // Länge nachträglich auslesen, damit sie in der Liste steht.
  vorhoeren.addEventListener('loadedmetadata', () => {
    if (spur === gewaehlt && Number.isFinite(vorhoeren.duration)) {
      gewaehlt.sekunden = Math.round(vorhoeren.duration);
    }
  }, { once: true });
});

verwerfen.addEventListener('click', () => {
  spurSetzen(null);
  zaehler.textContent = '0:00';
  dateiFeld.value = '';
  aufnahmehinweis.textContent = 'Verworfen.';
});

senden.addEventListener('click', async () => {
  if (!spur) return;
  fehler.textContent = '';
  senden.disabled = true;
  status.textContent = 'Lädt hoch …';
  const frage = new URLSearchParams({
    titel: titelFeld.value.trim() || 'Ohne Titel',
    notiz: notizFeld.value.trim(),
    endung: spur.endung,
    sekunden: String(spur.sekunden || 0),
  });
  try {
    await hole(`/api/hochladen?${frage}`, {
      method: 'POST',
      headers: { 'content-type': 'application/octet-stream' },
      body: spur.blob,
    });
    status.textContent = 'Fertig — sie kann es jetzt hören.';
    spurSetzen(null);
    titelFeld.value = '';
    notizFeld.value = '';
    zaehler.textContent = '0:00';
  } catch (e) {
    fehler.textContent = e.message;
    status.textContent = '';
    senden.disabled = false;
  }
});
</script>
