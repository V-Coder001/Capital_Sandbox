<title>Geschichte aufnehmen</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="stil.css">
<div class="huelle">
  <div class="kopf"><h1>Neue Geschichte</h1><a href="/">← Alle Geschichten</a></div>
  <p class="unterzeile">Direkt hier aufnehmen oder eine fertige Datei auswählen.</p>

  <section class="karte">
    <div class="reihe">
      <button id="knopf">Aufnahme starten</button>
      <span class="zaehler" id="zaehler">0:00</span>
      <span class="punkt" id="punkt" hidden>●</span>
    </div>
    <p class="hinweis" id="aufnahmehinweis" style="margin-bottom:0">Mikrofon wird erst beim Start gefragt.</p>
    <audio id="vorhoeren" controls hidden></audio>
  </section>

  <section class="karte">
    <label for="datei">… oder Datei vom Gerät</label>
    <input type="file" id="datei" accept="audio/*">
  </section>

  <section class="karte">
    <label for="titel">Titel</label>
    <input type="text" id="titel" placeholder="Der Nachtzug nach Lissabon" maxlength="120">
    <label for="notiz">Notiz an sie (optional)</label>
    <textarea id="notiz" maxlength="500" placeholder="Die zweite Hälfte ist etwas albern geworden."></textarea>
    <p class="fehler" id="fehler"></p>
    <div class="reihe">
      <button id="senden" disabled>Hochladen</button>
      <button class="still" id="verwerfen" type="button" hidden>Aufnahme verwerfen</button>
    </div>
    <p class="hinweis" id="status"></p>
  </section>

  <h2 style="margin:34px 0 10px;font-size:17px">Bisher hochgeladen</h2>
  <div id="vorhanden"><p class="hinweis">Lädt …</p></div>
</div>

<script type="module">
import { hole, dauer, datum } from './gemeinsam.js';

const STUECK = 3 * 1024 * 1024; // muss zur Function passen

const $ = (id) => document.getElementById(id);
const knopf = $('knopf'), zaehler = $('zaehler'), punkt = $('punkt'), vorhoeren = $('vorhoeren');
const dateiFeld = $('datei'), titelFeld = $('titel'), notizFeld = $('notiz');
const senden = $('senden'), verwerfen = $('verwerfen');
const fehler = $('fehler'), status = $('status'), aufnahmehinweis = $('aufnahmehinweis');

let aufnehmer = null, stuecke = [], spur = null, startZeit = 0, ticker = null, vorschauUrl = null;

if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) {
  knopf.disabled = true;
  aufnahmehinweis.textContent = 'Dieser Browser kann nicht direkt aufnehmen — nimm bitte eine Datei.';
} else if (!window.isSecureContext) {
  knopf.disabled = true;
  aufnahmehinweis.textContent = 'Aufnehmen geht nur über HTTPS. Nimm hier bitte eine Datei.';
}

function endungAus(typ, name) {
  const ausName = /\.([a-z0-9]+)$/i.exec(name || '')?.[1]?.toLowerCase();
  if (ausName) return ausName;
  const basis = (typ || '').split(';')[0];
  return { 'audio/webm': 'webm', 'audio/ogg': 'ogg', 'audio/mpeg': 'mp3',
           'audio/mp4': 'm4a', 'audio/wav': 'wav', 'audio/aac': 'aac' }[basis] || 'webm';
}

function spurSetzen(neu) {
  spur = neu;
  senden.disabled = !spur;
  verwerfen.hidden = !spur;
  if (vorschauUrl) URL.revokeObjectURL(vorschauUrl);
  if (spur) {
    vorschauUrl = URL.createObjectURL(spur.blob);
    vorhoeren.src = vorschauUrl;
    vorhoeren.hidden = false;
  } else {
    vorschauUrl = null;
    vorhoeren.removeAttribute('src');
    vorhoeren.hidden = true;
  }
}

knopf.addEventListener('click', async () => {
  if (aufnehmer) { aufnehmer.stop(); return; }
  fehler.textContent = '';
  let strom;
  try { strom = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch { fehler.textContent = 'Kein Zugriff aufs Mikrofon. Erlaube ihn im Browser — oder nimm eine Datei.'; return; }

  stuecke = [];
  aufnehmer = new MediaRecorder(strom);
  aufnehmer.addEventListener('dataavailable', (e) => { if (e.data.size) stuecke.push(e.data); });
  aufnehmer.addEventListener('stop', () => {
    const sekunden = Math.round((Date.now() - startZeit) / 1000);
    const typ = aufnehmer.mimeType || 'audio/webm';
    strom.getTracks().forEach((t) => t.stop());
    clearInterval(ticker);
    aufnehmer = null;
    punkt.hidden = true;
    knopf.textContent = 'Aufnahme starten';
    dateiFeld.value = '';
    spurSetzen({ blob: new Blob(stuecke, { type: typ }), endung: endungAus(typ), sekunden });
    aufnahmehinweis.textContent = `Aufgenommen: ${dauer(sekunden) || 'wenige Sekunden'}. Hör kurz rein.`;
  });
  startZeit = Date.now();
  aufnehmer.start();
  punkt.hidden = false;
  knopf.textContent = 'Aufnahme beenden';
  aufnahmehinweis.textContent = 'Läuft. Erzähl.';
  ticker = setInterval(() => {
    const s = Math.floor((Date.now() - startZeit) / 1000);
    zaehler.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  }, 250);
});

dateiFeld.addEventListener('change', () => {
  const datei = dateiFeld.files?.[0];
  if (!datei) return;
  const gewaehlt = { blob: datei, endung: endungAus(datei.type, datei.name), sekunden: 0 };
  spurSetzen(gewaehlt);
  aufnahmehinweis.textContent = 'Datei gewählt.';
  if (!titelFeld.value) titelFeld.value = datei.name.replace(/\.[^.]+$/, '');
  vorhoeren.addEventListener('loadedmetadata', () => {
    if (spur === gewaehlt && Number.isFinite(vorhoeren.duration)) gewaehlt.sekunden = Math.round(vorhoeren.duration);
  }, { once: true });
});

verwerfen.addEventListener('click', () => {
  spurSetzen(null);
  zaehler.textContent = '0:00';
  dateiFeld.value = '';
  aufnahmehinweis.textContent = 'Verworfen.';
});

senden.addEventListener('click', async () => {
  if (!spur) return;
  fehler.textContent = '';
  senden.disabled = true;
  verwerfen.disabled = true;

  const id = crypto.randomUUID();
  const gesamt = spur.blob.size;
  const teile = Math.ceil(gesamt / STUECK);
  try {
    // Stück für Stück, damit kein Aufruf an der 6-MB-Grenze von Netlify scheitert.
    for (let n = 0; n < teile; n++) {
      status.textContent = teile > 1
        ? `Lädt hoch … Teil ${n + 1} von ${teile}`
        : 'Lädt hoch …';
      const haeppchen = spur.blob.slice(n * STUECK, Math.min(gesamt, (n + 1) * STUECK));
      await hole(`/api/hochladen?id=${id}&teil=${n}`, {
        method: 'PUT',
        headers: { 'content-type': 'application/octet-stream' },
        body: haeppchen,
      });
    }
    status.textContent = 'Fast fertig …';
    await hole('/api/abschliessen', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        id, teile, bytes: gesamt,
        endung: spur.endung,
        titel: titelFeld.value.trim() || 'Ohne Titel',
        notiz: notizFeld.value.trim(),
        sekunden: spur.sekunden || 0,
      }),
    });
    status.textContent = 'Fertig — sie kann es jetzt hören.';
    spurSetzen(null);
    titelFeld.value = '';
    notizFeld.value = '';
    zaehler.textContent = '0:00';
    vorhandeneLaden();
  } catch (e) {
    fehler.textContent = e.message;
    status.textContent = 'Nichts veröffentlicht — du kannst es einfach nochmal versuchen.';
    senden.disabled = false;
  } finally {
    verwerfen.disabled = false;
  }
});

async function vorhandeneLaden() {
  const ziel = document.getElementById('vorhanden');
  try {
    const liste = await hole('/api/geschichten');
    if (!liste.length) { ziel.innerHTML = '<p class="hinweis">Noch nichts.</p>'; return; }
    ziel.innerHTML = '';
    for (const g of liste) {
      const zeile = document.createElement('div');
      zeile.className = 'karte reihe';
      zeile.style.justifyContent = 'space-between';
      const links = document.createElement('div');
      links.innerHTML = '<strong></strong><p class="meta" style="margin:0"></p>';
      links.querySelector('strong').textContent = g.titel;
      links.querySelector('.meta').textContent = [datum(g.datum), dauer(g.sekunden)].filter(Boolean).join(' · ');
      const weg = document.createElement('button');
      weg.className = 'gefahr';
      weg.textContent = 'Löschen';
      weg.addEventListener('click', async () => {
        if (!confirm(`„${g.titel}" wirklich löschen?`)) return;
        weg.disabled = true;
        try { await hole(`/api/geschichten/${encodeURIComponent(g.id)}`, { method: 'DELETE' }); vorhandeneLaden(); }
        catch (e) { alert(e.message); weg.disabled = false; }
      });
      zeile.append(links, weg);
      ziel.append(zeile);
    }
  } catch (e) {
    ziel.innerHTML = `<p class="fehler">${e.message}</p>`;
  }
}
vorhandeneLaden();
</script>
