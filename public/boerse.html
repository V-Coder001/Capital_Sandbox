<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Krypto-Börsen</title>
<style>
/* Öffentliche Ansicht der Krypto-Börsen. Handeln geht nur im Spiel.
   Farben stehen als Variablen oben, Texte im BRAND-Block unten. */
:root {
  --bg: #f4f6f8; --panel: #ffffff; --line: #dde3ea; --fg: #14202b; --muted: #617084;
  --accent: #0a9d6e; --down: #d6453d; --up: #0a9d6e; --chip: #e8eef4;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1116; --panel: #121b23; --line: #23313d; --fg: #e8eef4; --muted: #8496a8;
    --accent: #3ddc97; --down: #ff6b6b; --up: #3ddc97; --chip: #1b2832; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1116; --panel: #121b23; --line: #23313d; --fg: #e8eef4; --muted: #8496a8;
  --accent: #3ddc97; --down: #ff6b6b; --up: #3ddc97; --chip: #1b2832; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
}
header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.logo { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); display: grid; place-items: center; color: var(--bg); font-weight: 800; }
.brand { font-weight: 700; font-size: 18px; }
.tag { font-size: 11px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.grid { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 900px) { .grid { grid-template-columns: 300px minmax(0, 1fr) 300px; } }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; min-width: 0; }
.panel h2 { font-size: 11px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; margin: 0 0 10px; font-weight: 600; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; padding: 9px 6px; border-radius: 8px; cursor: pointer; align-items: center; }
.row:hover, .row.sel { background: var(--chip); }
.name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sub { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.num { text-align: right; font-variant-numeric: tabular-nums; }
.up { color: var(--up); } .down { color: var(--down); }
.stats { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 8px; }
.stats b { display: block; font-size: 18px; font-variant-numeric: tabular-nums; }
.stats span { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
.chart { width: 100%; height: auto; display: block; }
.ob { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.ob table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 12px; }
.ob td { padding: 3px 4px; } .ob th { text-align: left; color: var(--muted); font-weight: 500; font-size: 11px; padding: 3px 4px; }
.ob td:last-child { text-align: right; }
.badge { display: inline-block; font-size: 10px; padding: 2px 6px; border-radius: 4px; background: var(--chip); color: var(--muted); margin-left: 6px; vertical-align: middle; }
.hint { color: var(--muted); font-size: 12px; margin-top: 10px; }
footer { color: var(--muted); font-size: 11px; margin-top: 12px; text-align: center; }
</style>
</head>
<body>
<script>
/* ---- BRAND: Texte hier anpassen ---- */
const BRAND = {
  titel: "Krypto-Börsen",
  untertitel: "Kurse live aus dem Spiel",
  hinweis: "Handeln geht im Spiel. Diese Seite zeigt nur Kurse, Orderbuch und Verträge.",
  fuss: "Gebühr je Börse frei einstellbar. Coins sind ungedeckt.",
};
/* ---- Ende BRAND ---- */
</script>
<header>
  <div class="logo">₿</div>
  <div>
    <div class="brand" id="titel"></div>
    <div class="tag" id="untertitel"></div>
  </div>
</header>
<main class="grid">
  <section class="panel"><h2>Coins</h2><div id="liste"></div></section>
  <section class="panel">
    <div class="stats" id="kopf"></div>
    <svg class="chart" id="chart" viewBox="0 0 640 260" role="img" aria-label="Kursverlauf"></svg>
    <div class="ob" style="margin-top:10px">
      <div><h2>Kaufen</h2><table id="kauf"></table></div>
      <div><h2>Verkaufen</h2><table id="verkauf"></table></div>
    </div>
  </section>
  <section class="panel"><h2>Börsen</h2><div id="boersen"></div><h2 style="margin-top:16px">Verträge</h2><div id="vertraege"></div><p class="hint" id="hinweis"></p></section>
</main>
<footer id="fuss"></footer>
<script>
const $ = id => document.getElementById(id);
const fmt = (n, d = 2) => Number(n).toLocaleString("de-DE", { minimumFractionDigits: d, maximumFractionDigits: d });
let daten = { coins: [], boersen: [], buecher: {}, vertraege: [] };
let aktivId = null;
const verlauf = {};   // coinId -> Kursstände seit dem Öffnen dieser Seite

function text() {
  $("titel").textContent = BRAND.titel; $("untertitel").textContent = BRAND.untertitel;
  $("hinweis").textContent = BRAND.hinweis; $("fuss").textContent = BRAND.fuss;
}

function render() {
  const coins = daten.coins;
  if (!aktivId && coins.length) aktivId = coins[0].id;
  $("liste").innerHTML = coins.map(c => `
    <div class="row${c.id === aktivId ? " sel" : ""}" data-id="${c.id}">
      <div style="min-width:0"><div class="name">${c.name}<span class="badge">${c.boerse ? "Börse" : "ohne Börse"}</span></div><div class="sub">${fmt(c.umlauf, 0)} Coins ausgegeben</div></div>
      <div class="num"><div>${fmt(c.kurs)} $</div><div class="sub">Fundament ${fmt(c.fundament)} $</div></div>
    </div>`).join("") || `<p class="hint">Noch keine Coins. Software-Firmen geben sie im Spiel aus.</p>`;
  const c = coins.find(x => x.id === aktivId);
  if (c) {
    const s = verlauf[c.id] || [c.kurs];
    const diff = s.length > 1 ? (s[s.length - 1] / s[0] - 1) * 100 : 0;
    $("kopf").innerHTML = `<div><span>Kurs</span><b>${fmt(c.kurs)} $</b></div><div><span>Seit Öffnen</span><b class="${diff >= 0 ? "up" : "down"}">${diff >= 0 ? "+" : ""}${fmt(diff, 1)} %</b></div><div><span>Fundament</span><b>${fmt(c.fundament)} $</b></div>`;
    chart(s);
    const b = daten.buecher[c.id] || { kauf: [], verkauf: [] };
    const zeilen = arr => arr.slice(0, 10).map(r => `<tr><td>${fmt(r.preis)}</td><td>${fmt(r.menge, 0)}</td></tr>`).join("") || `<tr><td class="sub">Leer</td></tr>`;
    $("kauf").innerHTML = `<tr><th>Preis</th><th>Menge</th></tr>` + zeilen(b.kauf.sort((x, y) => y.preis - x.preis));
    $("verkauf").innerHTML = `<tr><th>Preis</th><th>Menge</th></tr>` + zeilen(b.verkauf.sort((x, y) => x.preis - y.preis));
  }
  $("boersen").innerHTML = daten.boersen.map(b => `<div class="row" style="cursor:default"><div class="name">${b.name}</div><div class="num sub">Gebühr ${fmt(b.gebuehr * 100, 1)} %</div></div>`).join("") || `<p class="hint">Noch keine Börse.</p>`;
  $("vertraege").innerHTML = daten.vertraege.map(v => `<div class="row" style="cursor:default"><div class="name">${name(v.boerseId)} führt ${name(v.coinId)}</div></div>`).join("") || `<p class="hint">Keine Verträge.</p>`;
}
const name = id => (daten.coins.find(c => c.id === id) || daten.boersen.find(b => b.id === id) || { name: "Firma" }).name;

function chart(s) {
  const w = 640, h = 260, pad = 30;
  const lo = Math.min(...s), hi = Math.max(...s);
  const sc = x => h - pad - (x - lo) / (hi - lo || 1) * (h - 2 * pad);
  const pts = s.map((v, i) => `${(i / Math.max(1, s.length - 1)) * w},${sc(v)}`).join(" ");
  const col = s[s.length - 1] >= s[0] ? "var(--up)" : "var(--down)";
  $("chart").innerHTML = `<polygon points="0,${h} ${pts} ${w},${h}" fill="${col}" opacity=".12"/><polyline points="${pts}" fill="none" stroke="${col}" stroke-width="2.2"/>`;
}

async function laden() {
  try {
    const r = await fetch("/api/boersen", { cache: "no-store" });
    daten = await r.json();
    for (const c of daten.coins) (verlauf[c.id] ??= []).push(c.kurs);
    for (const k in verlauf) if (verlauf[k].length > 300) verlauf[k].splice(0, verlauf[k].length - 300);
    render();
  } catch (e) { $("hinweis").textContent = "Verbindung zum Spiel fehlt. Neuer Versuch in 2 Sekunden."; }
}
$("liste").addEventListener("click", e => { const r = e.target.closest(".row"); if (r) { aktivId = r.dataset.id; render(); } });
text(); laden(); setInterval(laden, 2000);
</script>
</body>
</html>
